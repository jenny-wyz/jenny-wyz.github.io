# -- Site Configuration --
# Docs: https://blowfish.page/docs/getting-started/

theme = "blowfish"
baseURL = "https://jenny-wyz.github.io/"
defaultContentLanguage = "en"
# Entries may contain Chinese or German; this keeps Hugo's word counts and
# summaries sensible for CJK text mixed into English pages.
hasCJKLanguage = true

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false

enableEmoji = true

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"
  subject = "subjects"   # Notes subjects; a note can have several

[permalinks]
  [permalinks.term]
    subjects = "/notes/:slug/"   # subject pages live inside the Notes section

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "date"
        weight = 10
