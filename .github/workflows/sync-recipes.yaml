# Nightly sync of the Recipes section from Notion.
#
# Reads "Recipes" and rewrites the synced files under
# content/recipes/ (every recipe page; hand-written files are left
# alone). When anything changed, commits and starts the Pages deploy.
#
# One-time setup:
#   * The same NOTION_TOKEN secret as the reading sync.
#   * In Notion, open the "Recipes" page "Recipes", menu (...) >
#     Connections > add the integration used for the reading list.
#
# Run it by hand from the Actions tab ("Run workflow") to test.
name: Sync recipes from Notion

on:
  schedule:
    - cron: "53 3 * * *"   # every day, 03:53 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "sync-recipes"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so a rebase before the push always works

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python3 -I scripts/test_sync_recipes.py

      - name: Sync recipes from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::NOTION_TOKEN secret is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          python3 scripts/sync_recipes.py --verbose

      - name: Commit and push changes
        id: commit
        run: |
          git add -A -- content/recipes
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          n=$(grep -rl "^notion_id:" content/recipes | wc -l)
          git commit -m "Sync recipes from Notion ($n notes)"
          # Another sync, or a push of yours, may have landed on main while this
          # ran. Put this commit on top of the latest main and try again.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash --quiet origin main && git push origin HEAD:main; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" = 5 ]; then echo "::error::Could not push after 5 tries"; exit 1; fi
            sleep $((i * 5))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hugo.yaml --ref main
