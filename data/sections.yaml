# Per-section color themes.
#
# Every top-level section can have its own look. The key is the folder name
# under content/. Anything not listed here uses the site default (the
# "capsule" scheme in assets/css/schemes/capsule.css).
#
# Fields (all optional, RGB triplets as "r, g, b"):
#   primary:   50..900 ramp for links, buttons, highlights
#   dark_bg:   page background in dark mode        (overrides neutral-800)
#   dark_deep: panels and code blocks in dark mode (overrides neutral-900)
#   dark_edge: borders and cards in dark mode      (overrides neutral-700)
#   light_bg:  page background in light mode       (overrides neutral)
#   icon:      Font Awesome icon name shown on the home page card
#   tagline:   short line shown on the home page card
#
# A single page can also pick any theme with `colors: <key>` in its front matter.

