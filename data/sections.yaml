  tagline: "weeks gone by"
  icon: "pen-nib"
  primary:
    50: "254, 252, 234"
    100: "254, 246, 197"
    200: "247, 227, 195"   # L: bang
    300: "252, 222, 187"   # D: calendar 123
    400: "224, 176, 53"    # D: WörterDW; hover; <>s
    500: "219, 172, 78"    # L&D: / ; calendar box+bkg; <>bkg
    600: "204, 144, 15"    # L: WörterDW; hover; <>s
    700: "163, 88, 13"     # L: calendar 123
    800: "139, 76, 22"     # D: bang
    900: "116, 58, 16"
  dark_bg: "32, 29, 24"
  dark_deep: "24, 19, 12"
  dark_edge: "66, 56, 38"
  light_bg: "250, 249, 245"

